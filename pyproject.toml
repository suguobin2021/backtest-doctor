[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-doctor"
version = "0.4.0"
description = "Offline backtest integrity checks for OHLCV, trade timing, and stability"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "suguobin2021"}]
dependencies = []
readme = "README.md"
keywords = ["backtesting", "audit", "data-validation", "lookahead-bias", "trading", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
[project.urls]
Homepage = "https://github.com/suguobin2021/backtest-doctor"
Documentation = "https://github.com/suguobin2021/backtest-doctor/blob/main/docs/QUICKSTART.md"
Source = "https://github.com/suguobin2021/backtest-doctor"
Issues = "https://github.com/suguobin2021/backtest-doctor/issues"
Changelog = "https://github.com/suguobin2021/backtest-doctor/blob/main/CHANGELOG.md"


[project.scripts]
backtest-doctor = "backtest_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
