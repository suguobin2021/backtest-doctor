[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-doctor"
version = "0.4.0rc4"
description = "Offline backtest integrity checks for OHLCV, trade timing, and stability"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "suguobin2021"}]
dependencies = []
readme = "README.md"

[project.scripts]
backtest-doctor = "backtest_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
