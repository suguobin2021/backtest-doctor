name: Audited stable release (owner-triggered)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RELEASE to approve a new stable GitHub release; DRY_RUN for checks only'
        required: true
        default: 'DRY_RUN'
        type: string

permissions:
  contents: read

jobs:
  stable-release:
    name: Review exact main commit and release only on explicit owner approval
    if: ${{ github.repository == 'suguobin2021/backtest-doctor' && github.actor == 'suguobin2021' && github.triggering_actor == 'suguobin2021' && (inputs.confirmation == 'RELEASE' || inputs.confirmation == 'DRY_RUN') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce repository, version and fresh immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'suguobin2021/backtest-doctor'
          test "$GITHUB_REF" = 'refs/heads/main'
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from importlib.util import spec_from_file_location, module_from_spec
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          spec = spec_from_file_location('public_stable_version', 'src/backtest_doctor/__init__.py')
          obj = module_from_spec(spec); spec.loader.exec_module(obj)
          import re
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) and obj.__version__ == version, 'stable source version mismatch'
          print('STABLE_VERSION_MATCH=PASS')
          PY
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Stable release already exists: no re-publish permitted'
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo 'Stable tag already exists: refuses to move it'
            exit 1
          fi
      - name: Require completed green matrix CI on exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=10" --jq '.workflow_runs[0].conclusion // "pending"')"
            echo "Cross-platform CI: $state"
            if [ "$state" = 'success' ]; then ok=1; break; fi
            if [ "$state" != 'pending' ] && [ "$state" != 'null' ]; then exit 1; fi
            sleep 10
          done
          test "$ok" = '1'
      - name: Rebuild, test and inspect source, wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_release.py --source .
          python -m pip install --disable-pip-version-check build
          python -m build --sdist --wheel --outdir dist
          python tools/verify_release.py --source . --dist dist
          python -m pip install --no-deps dist/*.whl
          python -m unittest discover -s tests -q
          python -m backtest_doctor --version
          python -m backtest_doctor ohlcv examples/ohlcv_good.csv
          python -m backtest_doctor import-trades examples/vectorbt_synthetic.csv --framework vectorbt --explain
          sha256sum dist/*
      - name: Create immutable GitHub stable release after owner approval
        if: ${{ inputs.confirmation == 'RELEASE' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v$version"
          gh release create "$tag" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Backtest Doctor $tag" \
            --notes "First stable core: offline data and trade-timing audits, synthetic demos, deterministic privacy-minimal JSON/HTML, and fixed diagnostic explanations. Experimental framework CSV adapters remain limited to settled trade summaries and cannot establish strategy causality or profitability. No private data."
          echo 'STABLE_GITHUB_RELEASE=CREATED;PYPI_UPLOAD_REQUIRES_SEPARATE_OWNER_APPROVAL'
