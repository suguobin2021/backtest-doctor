name: Synthetic-only compatibility tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: windows-latest, python-version: '3.11'}
          - {os: macos-latest, python-version: '3.11'}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public source allowlist
        run: python tools/verify_release.py --source .
      - name: Install local package
        run: python -m pip install --no-deps .
      - name: Unit tests (synthetic-only)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: python -m backtest_doctor --version
      - name: Redacted audit smoke
        run: python -m backtest_doctor ohlcv examples/ohlcv_good.csv

  action-smoke:
    name: Composite action / synthetic-only smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run action on safe bundled fixtures
        uses: ./.github/actions/audit
        with:
          ohlcv-file: examples/ohlcv_good.csv
          ledger-file: examples/ledger_good.csv
          stability-file: examples/stability_demo.csv
          fail-on-warn: 'false'
          html-report: synthetic-action-report.html
      - name: Check synthetic aliased columns
        shell: bash
        run: |
          python -m backtest_doctor bundle             --ohlcv-file examples/ohlcv_alias.csv             --ledger-file examples/ledger_alias.csv             --stability-file examples/stability_alias.csv             --columns examples/columns_synthetic.json
      - name: Assert an offline HTML report was produced
        shell: bash
        run: |
          test -s synthetic-action-report.html
          grep -q 'Backtest Doctor' synthetic-action-report.html
