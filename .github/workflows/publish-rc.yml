name: Bootstrap one audited PyPI prerelease via OIDC

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-rc.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-first-pypi:
    name: Dispatch immutable tag v0.4.0rc4 once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact repository and signed-off release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'suguobin2021/backtest-doctor'
          tag='v0.4.0rc4'
          expected_sha='d45ca5ea63ff96f3d1c67a96a00984b368cb24d8'
          actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          test "$actual_sha" = "$expected_sha"
          status="$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' https://pypi.org/pypi/backtest-doctor/json)"
          if [ "$status" = '200' ]; then
            echo 'PyPI project already exists: no automatic repeat upload.'
            exit 0
          fi
          if [ "$status" != '404' ]; then
            echo 'PyPI availability was not confirmed; refusing to dispatch.'
            exit 1
          fi
          gh workflow run publish-pypi.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$tag" \
            --field confirmation=PUBLISH
          echo 'PYPI_DISPATCH_REQUESTED=YES'
